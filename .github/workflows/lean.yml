name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Audit proof dependencies
        run: lake env lean scripts/Audit.lean
      - name: Check audit coverage and rejection controls
        run: python3 scripts/test_audit.py
      - name: Lint declarations
        run: lake lint
      - name: Lint source style
        run: lake exe lint-style
